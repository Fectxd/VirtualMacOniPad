name: Build VirtualMac (deb)

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - name: Show disk before
        run: df -h /

      - name: Install Homebrew dependencies
        run: |
          brew tap hudochenkov/sshpass || true
          # sshpass tap is untrusted in CI; it is only needed for USB deploy,
          # not for building the deb. Ignore its failure and install the rest.
          HOMEBREW_NO_AUTO_UPDATE=1 brew bundle install --file VirtualMac/Brewfile || true

      - name: Show disk after deps
        run: df -h /

      - name: Build deb
        working-directory: VirtualMac
        run: |
          ./setup.sh --non-interactive --skip-dependencies

      - name: Collect artifacts
        run: |
          df -h /
          find VirtualMac/build -name '*.deb' -print
          find VirtualMac/build -maxdepth 2 -type f -name '*.deb' -exec cp {} /tmp/ \;

      - name: Upload deb
        uses: actions/upload-artifact@v4
        with:
          name: VirtualMac-deb
          path: /tmp/*.deb
          if-no-files-found: warn
